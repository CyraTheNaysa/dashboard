<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="dashboard">
            <section class="clock-section">
                <div id="clock">1:30 PM</div>
                <div id="date">Wednesday, 9 September 2026</div>
                <div id="current-task"></div>
            </section>
            <section class="quote-selection">
                <p id="quote">Fetching Today's quote...</p>
                <p id="author"></p>
            </section>
            <div class="shortcuts">
                <button class="shortcut add-button" onclick="addShortcut()">
                    +
                </button>
                <button class="shortcut" onclick="openShortcut('https://ielts.idp.com/prepare/academic-and-ukvi')">
                    IELTS
                </button>
                <button class="shortcut" onclick="openShortcut('https://www.youtube.com/')">
                    Youtube
                </button>
                <button class="shortcut" onclick="openShortcut('https://www.instagram.com/')">
                    Instagram
                </button>
            </div>
            <section class="task-section">
                <h2>Task Of The Day
                    <button class="add-task" onclick="addtask()">+</button>
                </h2>
                <div id="task-list">
                    <div class="task" draggable="true">
                        <div class="task-content">
                            <strong id="task-name">Designing Webinar Certificates</strong>>
                            <span id="task-deadline">Deadline : 9 September</span>
                        </div>

                        <button class="edit-task">O</button>
                        <button class="complete-task">v</button>
                        <button class="delete-task">X</button>
                    </div>
                </div>
            </section>
        </main>

        <script src="script.js"></script>

    </body>
</html>
